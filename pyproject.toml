[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyexo"
version = "0.2.0"
description = "Python client for the MYOB EXO REST API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Panashe M Ngwerume" }]
dependencies = ["requests>=2.25"]
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests",
    "responses>=0.25",
]

[project.urls]
Homepage = "https://github.com/anphase/pyexo"
Issues = "https://github.com/anphase/pyexo/issues"

[tool.setuptools]
packages = ["exo"]

[tool.setuptools.package-data]
exo = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["exo"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
